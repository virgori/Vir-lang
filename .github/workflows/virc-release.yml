name: Virc Multi-Target Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: virc-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build compiler outputs from the release source
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          mkdir -p dist/release-binaries
          chmod +x bin/virc
          python3 tools/preexpand_virc.py dist/release-binaries/virc-expanded.vri
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-macos-arm64" -q
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-linux-x86_64.s" \
            --target linux-x86_64 -S -q
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-linux-arm64.s" \
            --target linux-arm64 -S -q
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-wasm32.wasm" \
            --target wasm32-wasi-p1 --format wasm -q
          codesign -f -s - -i virc-bootstrap \
            "dist/release-binaries/virc-${version}-macos-arm64"
          "dist/release-binaries/virc-${version}-macos-arm64" \
            tests/bootstrap_codegen/cg_arith.vri -o dist/release-binaries/smoke
          codesign -f -s - dist/release-binaries/smoke
          smoke_output="$(dist/release-binaries/smoke | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "macos-arm64 smoke: $smoke_output"
          test "$smoke_output" = '30 90'
          LC_ALL=C grep -a "v${version}" \
            "dist/release-binaries/virc-${version}-macos-arm64" >/dev/null
          rm dist/release-binaries/smoke

      - uses: actions/upload-artifact@v4
        with:
          name: virc-cross-inputs
          path: dist/release-binaries/virc-*
          if-no-files-found: error

  linux-and-wasm:
    needs: [macos-arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: virc-cross-inputs
          path: dist/release-binaries

      - name: Install cross-target verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user wabt file

      - name: Assemble and link native Linux compilers
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          out=dist/release-binaries
          for asm in \
            "$out/virc-${version}-linux-x86_64.s" \
            "$out/virc-${version}-linux-arm64.s"; do
            awk '
              /^\.globl / {
                symbol=$2
                if (seen[symbol]++) { skipping=1 } else { skipping=0 }
              }
              !skipping { print }
            ' "$asm" > "$asm.dedup"
            mv "$asm.dedup" "$asm"
          done
          gcc -nostdlib -static -Wl,-e,_start \
            -o "$out/virc-${version}-linux-x86_64" \
            "$out/virc-${version}-linux-x86_64.s"
          aarch64-linux-gnu-gcc -nostdlib -static -Wl,-e,_start \
            -o "$out/virc-${version}-linux-arm64" \
            "$out/virc-${version}-linux-arm64.s"
          rm "$out/virc-${version}-linux-x86_64.s" \
             "$out/virc-${version}-linux-arm64.s" \
             "$out/virc-expanded.vri"

      - name: Verify formats, versions, and execution
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          out=dist/release-binaries
          chmod +x "$out"/virc-${version}-linux-*
          file "$out"/virc-${version}-*
          for binary in \
            "$out/virc-${version}-linux-x86_64" \
            "$out/virc-${version}-linux-arm64" \
            "$out/virc-${version}-wasm32.wasm"; do
            LC_ALL=C grep -a "v${version}" "$binary" >/dev/null
          done
          wasm-validate "$out/virc-${version}-wasm32.wasm"

          "$out/virc-${version}-linux-x86_64" \
            tests/bootstrap_codegen/cg_arith.vri -o "$out/smoke-x86_64"
          smoke_x86="$("$out/smoke-x86_64" | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "linux-x86_64 smoke: $smoke_x86"
          test "$smoke_x86" = '30 90'

          qemu-aarch64 "$out/virc-${version}-linux-arm64" \
            tests/bootstrap_codegen/cg_arith.vri \
            -o "$out/smoke-arm64" --target linux-arm64 --format elf
          smoke_arm="$(qemu-aarch64 "$out/smoke-arm64" | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "linux-arm64 smoke: $smoke_arm"
          test "$smoke_arm" = '30 90'

          rm "$out"/smoke-*

      - uses: actions/upload-artifact@v4
        with:
          name: virc-supported-targets
          path: |
            dist/release-binaries/virc-*-macos-arm64
            dist/release-binaries/virc-*-linux-arm64
            dist/release-binaries/virc-*-linux-x86_64
            dist/release-binaries/virc-*-wasm32.wasm
          if-no-files-found: error

  publish:
    needs: [linux-and-wasm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virc-supported-targets
          path: release-binaries

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-binaries/virc-* \
            --repo "$GITHUB_REPOSITORY" --clobber
