name: Virc Multi-Target Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git ref to verify; v* refs are published as releases
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: virc-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build compiler outputs from the release source
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          mkdir -p dist/release-binaries
          chmod +x bin/virc
          python3 tools/preexpand_virc.py dist/release-binaries/virc-expanded.vri
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-macos-arm64" -q
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-linux-arm64" \
            --target linux-arm64 -q
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-linux-x86_64" \
            --target linux-x86_64 -q
          bin/virc stdlib/vir/compiler/virc.vri \
            -o "dist/release-binaries/virc-${version}-linux-riscv64" \
            --target linux-riscv64 -q
          codesign -f -s - -i virc-bootstrap \
            "dist/release-binaries/virc-${version}-macos-arm64"
          "dist/release-binaries/virc-${version}-macos-arm64" \
            tests/bootstrap_codegen/cg_arith.vri -o dist/release-binaries/smoke
          codesign -f -s - dist/release-binaries/smoke
          smoke_output="$(dist/release-binaries/smoke | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "macos-arm64 smoke: $smoke_output"
          test "$smoke_output" = '30 90'
          LC_ALL=C grep -a "v${version}" \
            "dist/release-binaries/virc-${version}-macos-arm64" >/dev/null
          rm dist/release-binaries/smoke

      - uses: actions/upload-artifact@v4
        with:
          name: virc-cross-inputs
          path: dist/release-binaries/virc-*
          if-no-files-found: error

  linux-native:
    needs: [macos-arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: virc-cross-inputs
          path: dist/release-binaries

      - name: Install cross-target execution tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file qemu-user

      - name: Verify formats, versions, and execution
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          out=dist/release-binaries
          chmod +x "$out"/virc-${version}-linux-*
          file "$out"/virc-${version}-*
          for binary in \
            "$out/virc-${version}-linux-arm64" \
            "$out/virc-${version}-linux-x86_64" \
            "$out/virc-${version}-linux-riscv64"; do
            LC_ALL=C grep -a "v${version}" "$binary" >/dev/null
          done

          timeout 180 "$out/virc-${version}-linux-x86_64" \
            tests/bootstrap_codegen/cg_arith.vri --target linux-x86_64 \
            -o "$out/smoke-x86_64"
          smoke_x86="$("$out/smoke-x86_64" | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "linux-x86_64 smoke: $smoke_x86"
          test "$smoke_x86" = '30 90'

          timeout 180 qemu-aarch64 "$out/virc-${version}-linux-arm64" \
            tests/bootstrap_codegen/cg_arith.vri --target linux-arm64 \
            -o "$out/smoke-arm64"
          smoke_arm="$(qemu-aarch64 "$out/smoke-arm64" | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "linux-arm64 smoke: $smoke_arm"
          test "$smoke_arm" = '30 90'

          timeout 180 qemu-riscv64 "$out/virc-${version}-linux-riscv64" \
            tests/bootstrap_codegen/cg_arith.vri --target linux-riscv64 \
            -o "$out/smoke-riscv64"
          smoke_riscv="$(qemu-riscv64 "$out/smoke-riscv64" | tr -d '\r' | awk 'NF { printf "%s%s", sep, $0; sep=" " }')"
          echo "linux-riscv64 smoke: $smoke_riscv"
          test "$smoke_riscv" = '30 90'

          rm "$out"/smoke-*

      - uses: actions/upload-artifact@v4
        with:
          name: virc-supported-targets
          path: |
            dist/release-binaries/virc-*-macos-arm64
            dist/release-binaries/virc-*-linux-arm64
            dist/release-binaries/virc-*-linux-x86_64
            dist/release-binaries/virc-*-linux-riscv64
          if-no-files-found: error

  publish:
    needs: [linux-native]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: virc-supported-targets
          path: release-binaries

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/report/V${version//./_}_RELEASE_NOTES.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-binaries/virc-* \
              --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" release-binaries/virc-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vir Compiler ${version}" --notes-file "$notes"
          else
            gh release create "$TAG" release-binaries/virc-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vir Compiler ${version}" --generate-notes
          fi
