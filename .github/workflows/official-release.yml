name: Vir — Official Calendar Release

on:
  push:
    tags:
      - "v20*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing official tag to publish (vYYYY.R.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vir-official-release-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish official release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag, metadata, notes, and main identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          release_output="$(tools/validate_official_release_tag.sh "$RELEASE_TAG")"
          mapfile -t release_data <<< "$release_output"
          public_version="${release_data[0]}"
          notes_file="${release_data[1]}"

          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main
          main_commit="$(git rev-parse FETCH_HEAD)"

          if [ "$tag_commit" != "$checkout_commit" ]; then
            echo "::error::Tag does not resolve to the checked-out commit"
            exit 1
          fi
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "::error::Official release tag must point exactly to main HEAD"
            exit 1
          fi

          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$public_version" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes_file" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Reject an existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$RELEASE_TAG' already exists"
            exit 1
          fi

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Vir ${RELEASE_VERSION}.0" \
            --notes-file "$RELEASE_NOTES"
