name: Vir — Cross-Platform Build & Release

on:
  push:
    tags: ['v*']      # triggered by version tags like v0.1.0
  workflow_dispatch:   # manual trigger from GitHub UI

permissions:
  contents: write      # to upload release assets

env:
  PYTHON_VERSION: '3.11'

# ────────────────────────────────────────────────────
#  Build matrix: 6 targets covering macOS/Linux/Windows
#  on both x86_64 and ARM64
# ────────────────────────────────────────────────────
jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS ──
          - os: macos-14            # ARM64 runner (M1/M2)
            arch: arm64
            platform: macos
            lib_ext: dylib
            artifact: vir-macos-arm64
            cc: clang

          - os: macos-13            # x86_64 runner
            arch: x86_64
            platform: macos
            lib_ext: dylib
            artifact: vir-macos-x86_64
            cc: clang

          # ── Linux ──
          - os: ubuntu-22.04        # x86_64 (works on Ubuntu/Debian/Rocky/RHEL)
            arch: x86_64
            platform: linux
            lib_ext: so
            artifact: vir-linux-x86_64
            cc: gcc

          - os: ubuntu-22.04        # ARM64 via cross-compilation
            arch: arm64
            platform: linux
            lib_ext: so
            artifact: vir-linux-arm64
            cc: aarch64-linux-gnu-gcc
            cross: true

          # ── Windows ──
          - os: windows-latest      # x86_64
            arch: x86_64
            platform: windows
            lib_ext: dll
            artifact: vir-windows-x86_64
            cc: gcc                 # MinGW

          - os: windows-latest      # ARM64 (cross-compile)
            arch: arm64
            platform: windows
            lib_ext: dll
            artifact: vir-windows-arm64
            cc: clang
            cross: true

    runs-on: ${{ matrix.os }}
    name: native / ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      # ── Cross-compile toolchains ──
      - name: Install ARM64 cross-compiler (Linux)
        if: matrix.cross && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install MinGW (Windows)
        if: matrix.platform == 'windows' && !matrix.cross
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      # ── Build libvir_core ──
      - name: Build native library
        working-directory: core
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          # For cross-compilation, override arch detection
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            if [[ "${{ matrix.arch }}" == "arm64" && "${{ matrix.platform }}" == "linux" ]]; then
              export UNAME_M=aarch64
              export CC=aarch64-linux-gnu-gcc
              export AR=aarch64-linux-gnu-ar
            fi
          fi
          make clean
          make all
          make test || echo "::warning::Tests skipped (cross-compile)"
          echo "── Build artifacts ──"
          ls -la lib/

      # ── Build standalone CLI binary ──
      - name: Build CLI binary
        working-directory: core
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          make cli
          ls -la build/vir*

      # ── Package artifacts ──
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          # Native library
          cp core/lib/libvir_core.${{ matrix.lib_ext }} dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp core/lib/libvir_core.a dist/${{ matrix.artifact }}/ 2>/dev/null || true
          # CLI binary
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp core/build/vir.exe dist/${{ matrix.artifact }}/ 2>/dev/null || true
          else
            cp core/build/vir dist/${{ matrix.artifact }}/ 2>/dev/null || true
          fi
          # Utility binaries
          cp core/build/cpu_caps* dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp core/build/micro_prober* dist/${{ matrix.artifact }}/ 2>/dev/null || true
          # Metadata
          echo "${{ matrix.platform }}-${{ matrix.arch }}" > dist/${{ matrix.artifact }}/TARGET
          echo "${{ github.ref_name }}" > dist/${{ matrix.artifact }}/VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

  # ────────────────────────────────────────────────────
  #  Build Python wheel (platform-specific, ships libvir_core inside)
  # ────────────────────────────────────────────────────
  build-wheel:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            artifact: vir-macos-arm64
            plat: macosx_14_0_arm64
          - os: macos-13
            arch: x86_64
            artifact: vir-macos-x86_64
            plat: macosx_13_0_x86_64
          - os: ubuntu-22.04
            arch: x86_64
            artifact: vir-linux-x86_64
            plat: manylinux_2_28_x86_64
          - os: ubuntu-22.04
            arch: arm64
            artifact: vir-linux-arm64
            plat: manylinux_2_28_aarch64
          - os: windows-latest
            arch: x86_64
            artifact: vir-windows-x86_64
            plat: win_amd64

    runs-on: ${{ matrix.os }}
    name: wheel / ${{ matrix.plat }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native-lib/

      - name: Inject native lib into package
        shell: bash
        run: |
          mkdir -p src/native/lib
          cp native-lib/libvir_core.* src/native/lib/ 2>/dev/null || true
          cp native-lib/vir_core.dll  src/native/lib/ 2>/dev/null || true
          echo "Injected native lib:"
          ls -la src/native/lib/

      - name: Build wheel
        shell: bash
        run: |
          pip install build setuptools wheel
          python -m build --wheel
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

  # ────────────────────────────────────────────────────
  #  Build compiled stdlib (.vsib) per architecture
  # ────────────────────────────────────────────────────
  build-stdlib:
    runs-on: ubuntu-22.04
    name: stdlib / vsib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Vir
        run: pip install -e .

      - name: Build stdlib (ARM64 + x86_64)
        run: |
          python -m scripts.build_stdlib --arch arm64
          mkdir -p dist/stdlib-arm64
          cp build/stdlib/*.vsib dist/stdlib-arm64/ 2>/dev/null || true
          cp build/stdlib/*.sri  dist/stdlib-arm64/ 2>/dev/null || true

          python -m scripts.build_stdlib --clean
          python -m scripts.build_stdlib --arch x86_64
          mkdir -p dist/stdlib-x86_64
          cp build/stdlib/*.vsib dist/stdlib-x86_64/ 2>/dev/null || true
          cp build/stdlib/*.sri  dist/stdlib-x86_64/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: stdlib-arm64
          path: dist/stdlib-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: stdlib-x86_64
          path: dist/stdlib-x86_64/

  # ────────────────────────────────────────────────────
  #  Test matrix — verify each platform works
  # ────────────────────────────────────────────────────
  test:
    needs: [build-wheel, build-stdlib]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            wheel: wheel-macosx_14_0_arm64
          - os: macos-13
            wheel: wheel-macosx_13_0_x86_64
          - os: ubuntu-22.04
            wheel: wheel-manylinux_2_35_x86_64
          - os: windows-latest
            wheel: wheel-win_amd64

    runs-on: ${{ matrix.os }}
    name: test / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel }}
          path: wheels/

      - name: Install and test
        shell: bash
        run: |
          pip install wheels/*.whl
          pip install pytest
          python -m pytest tests/ -x -q --tb=short

  # ────────────────────────────────────────────────────
  #  Build .deb packages (Debian/Ubuntu — x86_64 + ARM64)
  # ────────────────────────────────────────────────────
  build-deb:
    needs: build-native
    strategy:
      matrix:
        include:
          - arch: amd64
            native_artifact: vir-linux-x86_64
          - arch: arm64
            native_artifact: vir-linux-arm64
    runs-on: ubuntu-22.04
    name: deb / ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native_artifact }}
          path: core/lib/

      - name: Install cross-compiler (ARM64)
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build .deb
        run: |
          chmod +x packaging/linux/build_deb.sh packaging/linux/postinstall.sh
          bash packaging/linux/build_deb.sh --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # ────────────────────────────────────────────────────
  #  Build .rpm packages (Fedora/RHEL — x86_64 + aarch64)
  # ────────────────────────────────────────────────────
  build-rpm:
    needs: build-native
    strategy:
      matrix:
        include:
          - arch: x86_64
            native_artifact: vir-linux-x86_64
          - arch: aarch64
            native_artifact: vir-linux-arm64
    runs-on: ubuntu-22.04
    name: rpm / ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native_artifact }}
          path: core/lib/

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .rpm
        run: |
          chmod +x packaging/linux/build_rpm.sh
          bash packaging/linux/build_rpm.sh --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm

  # ────────────────────────────────────────────────────
  #  Build MSI installer (Windows Server x86_64)
  # ────────────────────────────────────────────────────
  build-msi:
    needs: build-native
    runs-on: windows-latest
    name: msi / windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vir-windows-x86_64
          path: core/lib/

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 4.0.4
        shell: pwsh

      - name: Build MSI
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build_msi.ps1 -SkipNative
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: msi-windows-x86_64
          path: dist/*.msi

  # ────────────────────────────────────────────────────
  #  Build Docker images (linux/amd64 + linux/arm64)
  # ────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-22.04
    name: docker / multi-arch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Build Docker image (amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t vir-lang:${{ github.ref_name }}-amd64 \
            --output type=docker,dest=dist/vir-docker-amd64.tar \
            -f Dockerfile .

      - name: Build Docker image (arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t vir-lang:${{ github.ref_name }}-arm64 \
            --output type=docker,dest=dist/vir-docker-arm64.tar \
            -f Dockerfile .

      - name: Compress Docker images
        run: |
          gzip dist/vir-docker-amd64.tar
          gzip dist/vir-docker-arm64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: dist/vir-docker-*.tar.gz

  # ────────────────────────────────────────────────────
  #  Release — create GitHub release with all assets
  # ────────────────────────────────────────────────────
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [test, build-deb, build-rpm, build-msi, build-docker]
    runs-on: ubuntu-22.04
    name: release

    steps:
      - uses: actions/checkout@v4

      # Download all artifacts
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Package release archives
        run: |
          cd all-artifacts
          for dir in vir-macos-arm64 vir-macos-x86_64 vir-linux-x86_64 vir-linux-arm64 vir-windows-x86_64 vir-windows-arm64; do
            if [ -d "$dir" ]; then
              tar czf "../${dir}.tar.gz" -C "$dir" .
              echo "Packaged $dir"
            fi
          done

          # Collect wheels
          mkdir -p ../release-wheels
          find . -name "*.whl" -exec cp {} ../release-wheels/ \;

          # Collect stdlib
          for dir in stdlib-arm64 stdlib-x86_64; do
            if [ -d "$dir" ]; then
              tar czf "../${dir}.tar.gz" -C "$dir" .
            fi
          done

          # Collect .deb, .rpm, .msi, Docker images
          mkdir -p ../release-packages
          find . -name "*.deb" -exec cp {} ../release-packages/ \;
          find . -name "*.rpm" -exec cp {} ../release-packages/ \;
          find . -name "*.msi" -exec cp {} ../release-packages/ \;
          find . -name "vir-docker-*.tar.gz" -exec cp {} ../release-packages/ \;
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            vir-macos-arm64.tar.gz
            vir-macos-x86_64.tar.gz
            vir-linux-x86_64.tar.gz
            vir-linux-arm64.tar.gz
            vir-windows-x86_64.tar.gz
            vir-windows-arm64.tar.gz
            stdlib-arm64.tar.gz
            stdlib-x86_64.tar.gz
            release-wheels/*.whl
            release-packages/*.deb
            release-packages/*.rpm
            release-packages/*.msi
            release-packages/vir-docker-*.tar.gz

  # ────────────────────────────────────────────────────
  #  Publish to npm (npmjs.com)
  # ────────────────────────────────────────────────────
  publish-npm:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [release]
    runs-on: ubuntu-22.04
    name: npm / publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        working-directory: npm
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${TAG_VERSION}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Publishing vir-lang@${TAG_VERSION}"

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────
  #  Publish Python wheel to PyPI
  # ────────────────────────────────────────────────────
  publish-pypi:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [release]
    runs-on: ubuntu-22.04
    name: pypi / publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Collect wheels
        run: |
          mkdir -p dist
          find all-artifacts -name "*.whl" -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
