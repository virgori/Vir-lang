[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vir-lang"
version = "0.4.0"
description = "Quizz-Core Engine – Vietnamese syntax, abstract VM core, self-patching binary"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Vir Team"},
]
keywords = ["programming-language", "vietnamese", "vm", "jit", "self-patching"]

dependencies = [
    "regex>=2023.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
vir = "src.runtime.lifecycle:main"
viron = "src.viron.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Package discovery & native lib bundling ──────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "stdlib*"]

[tool.setuptools.package-data]
"src.native.lib" = ["*.dylib", "*.so", "*.dll", "*.a"]
"stdlib" = ["**/*.vsib", "**/*.sri"]
