# Viron Source Workspace Manifest for Vir Compiler & Standard Library
# Replaces assemble_virc.py, preexpand_virc.py, sync_virc.py, and bootstrap scripts

[workspace]
name = "virc"
version = "3.3.0"
canonical_root = "stdlib/vir/compiler/main.vri"
bundle_destination = "stdlib/vir/compiler/virc.vri"
lockfile = ".vir/source-lock.toml"
source_roots = ["stdlib/vir/compiler", "stdlib/vir/rt", "stdlib/vir"]

[preludes]
alloc = "stdlib/vir/rt/alloc.vri"
string_rt = "stdlib/vir/rt/string_rt.vri"
vec_rt = "stdlib/vir/rt/vec_rt.vri"
io = "stdlib/vir/rt/io.vri"
source_manager = "stdlib/vir/compiler/source_manager.vri"
context = "stdlib/vir/compiler/context.vri"
parser = "stdlib/vir/compiler/parser.vri"
lexer = "stdlib/vir/compiler/lexer.vri"
pipeline = "stdlib/vir/compiler/pipeline.vri"
binary = "stdlib/vir/compiler/binary.vri"
linker = "stdlib/vir/compiler/linker.vri"
file = "stdlib/vir/compiler/file.vri"

[bundle]
strip_comments = false
strip_debug_asserts = false
provenance_markers = true

[compiler]
seed = "bin/virc"
stage1_out = "build/stage1/virc"
stage2_out = "build/stage2/virc"
stage3_out = "build/stage3/virc"
promote_target = "bin/virc"
