# ═══════════════════════════════════════════════════════════════════
# Vir Language Runtime — Server Configuration
# ═══════════════════════════════════════════════════════════════════
# Location: /etc/vir/vir.conf
# Format:   KEY = VALUE (shell-compatible)
# ═══════════════════════════════════════════════════════════════════

# ── Paths ─────────────────────────────────────────────────────────
VIR_HOME = /usr/local/share/vir
VIR_STDLIB_PATH = /usr/local/share/vir/stdlib
VIR_CACHE_DIR = /var/cache/vir
VIR_LOG_DIR = /var/log/vir
VIR_DATA_DIR = /var/lib/vir

# ── Runtime ───────────────────────────────────────────────────────
# JIT compilation threshold (functions called N times get JIT'd)
VIR_JIT_THRESHOLD = 100

# Maximum memory for the runtime heap (bytes, 0 = unlimited)
VIR_MAX_HEAP = 0

# Number of worker threads (0 = auto-detect CPU count)
VIR_WORKER_THREADS = 0

# ── Logging ───────────────────────────────────────────────────────
# Log level: debug, info, warn, error
VIR_LOG_LEVEL = info

# Log format: text, json
VIR_LOG_FORMAT = text

# ── Security ──────────────────────────────────────────────────────
# Enable code signature verification
VIR_VERIFY_SIGNATURES = true

# Sandbox mode: none, basic, strict
VIR_SANDBOX = basic

# ── Network (viron server mode) ───────────────────────────────────
VIR_BIND_ADDRESS = 127.0.0.1
VIR_BIND_PORT = 8420
VIR_MAX_CONNECTIONS = 1024

# ── Architecture-specific ─────────────────────────────────────────
# SIMD level: auto, none, sse42, avx2, neon
VIR_SIMD_LEVEL = auto

# GPU acceleration: auto, none, cuda, metal
VIR_GPU_BACKEND = auto
