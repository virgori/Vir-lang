# ═══════════════════════════════════════════════════════════════════
# Vir Language Runtime — Windows Server Configuration
# ═══════════════════════════════════════════════════════════════════
# Location: C:\ProgramData\Vir\config\vir.conf
# ═══════════════════════════════════════════════════════════════════

# ── Paths ─────────────────────────────────────────────────────────
VIR_HOME = C:\Program Files\Vir
VIR_STDLIB_PATH = C:\Program Files\Vir\stdlib
VIR_CACHE_DIR = C:\ProgramData\Vir\cache
VIR_LOG_DIR = C:\ProgramData\Vir\log
VIR_DATA_DIR = C:\ProgramData\Vir\data

# ── Runtime ───────────────────────────────────────────────────────
VIR_JIT_THRESHOLD = 100
VIR_MAX_HEAP = 0
VIR_WORKER_THREADS = 0

# ── Logging ───────────────────────────────────────────────────────
VIR_LOG_LEVEL = info
VIR_LOG_FORMAT = text

# ── Security ──────────────────────────────────────────────────────
VIR_VERIFY_SIGNATURES = true
VIR_SANDBOX = basic

# ── Network (viron server mode) ───────────────────────────────────
VIR_BIND_ADDRESS = 127.0.0.1
VIR_BIND_PORT = 8420
VIR_MAX_CONNECTIONS = 1024

# ── Architecture-specific ─────────────────────────────────────────
VIR_SIMD_LEVEL = auto
VIR_GPU_BACKEND = auto
